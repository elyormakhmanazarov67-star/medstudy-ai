 <title id="title">Ko‘krak qafasi: qovurg‘alar va to‘sh suyagi</title><desc id="description">Old tomondan qovurg‘alar, to‘sh suyagi va umurtqa. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
