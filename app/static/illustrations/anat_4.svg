 <title id="title">Yelka kamari: o‘mrov va kurak suyaklari</title><desc id="description">Yelka kamarining old va orqa tuzilmalari. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
