 <title id="title">Peshona va g‘alvirsimon suyaklar</title><desc id="description">Peshona, ko‘z kosasi va g‘alvirsimon suyak. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
