<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title description">
 <title id="title">Chanoq kamari: yon va bo‘g‘im ko‘rinishi</title><desc id="description">Yonbosh, o‘tirg‘ich, qov qismlari va sirka bo‘g‘imi. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
