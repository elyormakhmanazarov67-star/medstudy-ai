<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="t d">
<title id="t">Os frontale va os ethmoidale: soddalashtirilgan anatomik sxema</title>
<desc id="d">Chap tomonda kalla suyagining old ko‘rinishi: peshona suyagi yashil, g‘alvirsimon suyak ko‘kimtir rangda. O‘ng tomonda g‘alvirsimon suyakning asosiy qismlari alohida ko‘rsatilgan.</desc>
<rect width="900" height="565" fill="#f3f9f5"/>
<rect x="16" y="16" width="425" height="530" rx="19" fill="#fff" stroke="#cee4d4" stroke-width="2"/>
<rect x="459" y="16" width="425" height="530" rx="19" fill="#fff" stroke="#cee4d4" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="37" y="53" font-size="22" font-weight="700" fill="#193b2a">Kalla suyagi — old ko‘rinish</text>
<text x="37" y="77" font-size="14" fill="#4a6655">Yuz va kalla qismlarining sxematik tasviri</text>
<text x="480" y="53" font-size="22" font-weight="700" fill="#193b2a">Os ethmoidale</text>
<text x="480" y="77" font-size="14" fill="#4a6655">G‘alvirsimon suyakning asosiy qismlari</text>
</g>
