<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title description">
 <title id="title">Kalla yuz qismi: jag‘ va mayda suyaklar</title><desc id="description">Yuz skeleti va asosiy juft suyaklarning joylashuvi. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
