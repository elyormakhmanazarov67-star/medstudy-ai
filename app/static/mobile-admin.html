<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MedStudy AI — Mobil administrator</title>
  <link rel="stylesheet" href="/static/mobile-admin.css">
  <script src="/static/mobile-admin.js" defer></script>
</head>
<body>
  <main>
    <header><h1>MedStudy AI</h1><p>Mobil ilovaga ruxsat berish</p></header>
    <section>
      <label for="secret">Administrator maxfiy kaliti (Railway Variables)</label>
      <input id="secret" type="password" autocomplete="off" spellcheck="false" placeholder="Administrator kaliti" aria-label="Administrator kaliti">
      <button id="load" type="button">Arizalarni tekshirish</button>
    </section>
    <p id="status" role="status" aria-live="polite">Kalitni kiriting va arizalarni tekshiring.</p>
    <section>
      <h2>Ruxsat kutayotgan talabalar</h2>
      <ul id="requests"></ul>
    </section>
    <section>
      <h2>Avval berilgan ruxsatni bekor qilish</h2>
      <p>Avval tasdiqlangan mobil akkaunt ID raqamini kiriting.</p>
      <label for="account-id">Mobil akkaunt ID</label>
      <input id="account-id" type="number" min="1" step="1">
      <button id="revoke" type="button">Ruxsatni bekor qilish</button>
    </section>
    <footer>Faqat MedStudy AI administratorlari uchun. Maxfiy kalit brauzerda saqlanmaydi.</footer>
  </main>
</body>
</html>
