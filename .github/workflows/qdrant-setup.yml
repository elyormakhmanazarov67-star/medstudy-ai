name: Qdrant Cloud collection setup for MedStudy AI

on:
  push:
    branches: [feature/qdrant-vector-setup-20261110]
    paths:
      - 'scripts/qdrant_setup.py'
      - 'tests/test_qdrant_setup.py'
      - '.github/workflows/qdrant-setup.yml'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        description: 'status = check only; create = create collection if missing'
        options:
          - status
          - create

permissions:
  contents: read

jobs:
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install 'httpx>=0.27,<1'
      - name: Test locally with fake credentials and no network
        run: python -m unittest discover -s tests -p test_qdrant_setup.py -v
      - name: Check or create Qdrant Cloud collection
        if: github.event_name == 'workflow_dispatch'
        env:
          QDRANT_URL: "${{ secrets.QDRANT_URL }}"
          QDRANT_API_KEY: "${{ secrets.QDRANT_API_KEY }}"
        run: python scripts/qdrant_setup.py --mode "${{ inputs.operation }}"
