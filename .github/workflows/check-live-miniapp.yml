name: Check live Mini App assets and version
on:
  push:
    branches: [fix/preklinik-miniapp-cache-check-20261110]
    paths: ['.github/workflows/check-live-miniapp.yml']
permissions:
  contents: read
jobs:
  inspect-live-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check published Mini App over HTTPS
        env:
          BASE: https://medstudy-ai-production-f1c8.up.railway.app
        run: |
          set -eu
          curl --fail --show-error -L --max-time 12 -D /tmp/index-headers.txt "$BASE/?miniapp=preklinik-20261110-refresh1" -o /tmp/index.html
          curl --fail --show-error -L --max-time 12 -D /tmp/js-headers.txt "$BASE/static/app.js?v=1.0.7" -o /tmp/app.js
          curl --fail --show-error -L --max-time 12 "$BASE/static/illustrations/preklinik/catalog.json" -o /tmp/illustrations.json
          echo "INDEX:"
          grep -io 'app.js?v=[^"]*' /tmp/index.html || true
          grep -i '^cache-control:' /tmp/index-headers.txt || true
          echo "JS HEADERS:"
          grep -i '^cache-control:' /tmp/js-headers.txt || true
          echo "PUBLISHED LOGIC:"
          grep -o "l.subject_id==='stom_prerest'" /tmp/app.js | head -1 || true
          grep -o "case 'preklinik-visual'" /tmp/app.js | head -1 || true
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/illustrations.json'))
          print("Illustrations: "+str(len(a)))
          assert len(a)==31
          js=open('/tmp/app.js').read()
          html=open('/tmp/index.html').read()
          assert "l.subject_id==='stom_prerest'" in js
          assert "case 'preklinik-visual'" in js
          assert 'app.js?v=1.0.7' in html
          print('LIVE_PREKLINIK_ASSETS_OK')
          PY
