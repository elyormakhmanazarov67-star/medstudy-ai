name: MedStudy AI portable hosting preflight

on:
  push:
    branches:
      - feature/hosting-migration-prep-20261110
    paths:
      - 'hosting/**'
      - '.dockerignore'
      - 'tests/test_hosting_portability.py'
      - '.github/workflows/hosting-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check portable Docker Compose configuration and backup syntax
        run: |
          cp hosting/.env.example hosting/.env
          docker compose -f hosting/compose.yaml config --quiet
          bash -n hosting/backup.sh
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run hosting safety and existing Mini App API tests
        env:
          AI_ENABLED: '0'
          AUTO_SET_WEBHOOK: '0'
          DATABASE_PATH: '/tmp/medstudy-hosting-preflight-ci.sqlite'
        run: |
          python -m pytest -q tests/test_hosting_portability.py tests/test_miniapp.py tests/test_webhook.py
      - name: Build container and test unauthenticated health endpoint
        run: |
          docker build -f Dockerfile -t medstudy-portable:ci .
          docker run -d --name medstudy-hosting-smoke \
            -p 127.0.0.1:17890:8000 \
            -e BOT_TOKEN= \
            -e AUTO_SET_WEBHOOK=0 \
            -e AI_ENABLED=0 \
            -e DATABASE_PATH=/app/data/medstudy.db \
            medstudy-portable:ci
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:17890/api/health >/tmp/medstudy-health.json; then break; fi
            sleep 1
          done
          python -c "import json; assert json.load(open('/tmp/medstudy-health.json'))['status']=='ok'"
          docker stop medstudy-hosting-smoke
