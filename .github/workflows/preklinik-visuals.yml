name: MedStudy AI Preklinik visual guides CI
on:
  push:
    branches:
      - feature/preklinik-visuals-20261110
      - fix/miniapp-preklinik-refresh-20261110
    paths:
      - 'app/static/app.js'
      - 'app/main.py'
      - 'app/telegram_gateway.py'
      - 'tests/test_webhook.py'
      - 'tests/test_miniapp_fresh_assets.py'
      - 'app/static/index.html'
      - 'tests/check_theme.cjs'
      - 'app/static/illustrations/preklinik/**'
      - 'tests/test_preklinik_visuals.py'
      - '.github/workflows/preklinik-visuals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Validate Telegram Mini App JavaScript
        run: |
          node --check app/static/app.js
          node tests/check_theme.cjs
      - name: Validate every Preklinik diagram and existing Mini App APIs
        env:
          AUTO_SET_WEBHOOK: '0'
          AI_ENABLED: '0'
          DATABASE_PATH: '/tmp/medstudy-preklinik-ci.sqlite'
        run: |
          python -m pytest -q tests/test_preklinik_visuals.py tests/test_miniapp_fresh_assets.py tests/test_webhook.py tests/test_miniapp.py tests/test_curriculum.py tests/test_materials.py
