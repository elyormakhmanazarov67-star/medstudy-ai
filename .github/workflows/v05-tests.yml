name: MedStudy AI v0.5 checks
on:
  push:
    branches: [v0.5-dev]
  pull_request:
    branches: [main, v0.5-dev]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate web app JavaScript syntax
        run: |
          node --check app/static/app.js
          node tests/check_theme.cjs
      - name: Run backend unit and API tests (no real Telegram/OpenAI calls)
        env:
          AI_ENABLED: "0"
          AUTO_SET_WEBHOOK: "0"
          DATABASE_PATH: "/tmp/medstudy-v05-ci.sqlite"
        run: python -m pytest -q tests/test_miniapp.py tests/test_tutor.py tests/test_webhook.py tests/test_study_plan.py tests/test_curriculum.py tests/test_lesson_helper.py tests/test_materials.py tests/test_anatomy_vision.py
