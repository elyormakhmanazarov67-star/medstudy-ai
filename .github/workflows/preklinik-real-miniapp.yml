name: Check actual Telegram Mini App Preklinik visuals
on:
  push:
    branches:
      - fix/preklinik-on-real-telegram-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Validate theme, study page and visual screen interactions
        run: |
          node --check app/static/app.js
          node tests/check_theme.cjs
          node tests/check_preklinik_miniapp_ui.cjs
      - name: Validate all 31 illustrations and existing APIs
        env:
          AI_ENABLED: '0'
          AUTO_SET_WEBHOOK: '0'
          DATABASE_PATH: '/tmp/medstudy-live-target-ci.sqlite'
        run: |
          python -m pytest -q tests/test_preklinik_visuals.py tests/test_miniapp.py tests/test_tutor.py tests/test_webhook.py tests/test_curriculum.py tests/test_materials.py
