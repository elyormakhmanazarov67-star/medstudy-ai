name: MedStudy AI Mobile Flutter CI
on:
  push:
    branches:
      - feature/native-mobile-mvp
      - feature/mobile-auth-v2
    paths:
      - 'mobile/**'
      - 'app/mobile_auth.py'
      - 'app/telegram_gateway.py'
      - 'app/main.py'
      - 'tests/test_mobile_auth.py'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
jobs:
  backend-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Mobile auth tests
        env:
          AUTO_SET_WEBHOOK: '0'
          AI_ENABLED: '0'
          DATABASE_PATH: '/tmp/medstudy-ci.sqlite'
        run: python -m pytest -q tests/test_mobile_auth.py tests/test_miniapp.py tests/test_tutor.py tests/test_webhook.py tests/test_study_plan.py tests/test_curriculum.py tests/test_lesson_helper.py tests/test_materials.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform files
        run: flutter create . --platforms=android,ios --project-name medstudy_ai --org uz.medstudy
        working-directory: mobile
      - name: Remove generated example test
        run: rm -f test/widget_test.dart
        working-directory: mobile
      - name: Dependencies
        run: flutter pub get
        working-directory: mobile
      - name: Analyze Flutter source
        run: flutter analyze
        working-directory: mobile
      - name: Test restored study catalog
        run: flutter test
        working-directory: mobile
      - name: Add Android INTERNET permission
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          entry = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', entry + '\n    <application', 1)
              path.write_text(text, encoding="utf-8")
          PY
        working-directory: mobile
      - name: Build Android debug APK
        run: flutter build apk --debug
        working-directory: mobile
      - name: Verify private study lessons are not packaged
        run: |
          if unzip -Z1 build/app/outputs/flutter-apk/app-debug.apk | grep -E 'flutter_assets/(assets/data/lessons\.json|assets/illustrations/)'; then
            echo "ERROR: private study assets embedded in APK"
            exit 1
          fi
        working-directory: mobile
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: medstudy-ai-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
