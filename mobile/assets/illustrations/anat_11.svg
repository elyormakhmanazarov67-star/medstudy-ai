<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title description">
 <title id="title">Ponasimon va chakka suyaklari</title><desc id="description">Ponasimon suyak va chakka suyagining yon tomondan tuzilishi. Bu soddalashtirilgan o‘quv sxemasi bo‘lib, klinik atlas emas.</desc>
